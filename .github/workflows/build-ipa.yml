name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 必须用 macOS runner，Windows/Linux 没有 Xcode
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        run: xcodegen generate --spec project.yml

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Pano720.xcodeproj \
            -scheme Pano720 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: 打包成 Payload/*.ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          rm -rf Payload Pano720-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Pano720-unsigned.ipa Payload
          ls -lh Pano720-unsigned.ipa
          # 顺带确认是 arm64 可执行文件
          file "Payload/$(basename "$APP")/Pano720"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Pano720-unsigned-ipa
          path: Pano720-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
